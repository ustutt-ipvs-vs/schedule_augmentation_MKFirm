
[General]
network = d6g.simulations.agv.AGVNetwork
sim-time-limit = 10s
description = "AGVNetwork"

**.displayGateSchedules = true
**.gateFilter = "**.ethg[1].**"
**.gateScheduleVisualizer.height = 16
**.gateScheduleVisualizer.placementHint = "top"

**.datarate = 100Mbps
**.bitrate = 100Mbps

*.histogramContainer.histograms = {
    Uplink: "../../../deterministic6g_data/PD-Wireless-5G-2a/uplink_0.xml", 
    Downlink: "../../../deterministic6g_data/PD-Wireless-5G-2a/downlink_0.xml"}
*.detcom.**.delayDownlink = rngProvider("histogramContainer","Downlink")
*.detcom.**.delayUplink = rngProvider("histogramContainer","Uplink")

*.CORE_11.hasOutgoingStreams = true
*.CORE_11.numApps = 5
*.CORE_11.app[*].source.productionInterval = 20ms

*.CORE_12.hasOutgoingStreams = true
*.CORE_12.numApps = 5
*.CORE_12.app[*].source.productionInterval = 20ms

*.AGV0_03.hasOutgoingStreams = true
