
[General]
network = d6g.simulations.emergency_traffic.EmergencyTrafficNetwork
sim-time-limit = 10s
description = EmergencyTrafficNetwork

#--------------------------------------------
# Ethernet Link Specification
#--------------------------------------------
*.n0.eth[0].bitrate = 1000Mbps
*.n1.eth[0].bitrate = 1000Mbps
*.n0.eth[2].bitrate = 1000Mbps
*.n2.eth[0].bitrate = 1000Mbps
*.n1.eth[2].bitrate = 1000Mbps
*.n3.eth[0].bitrate = 1000Mbps


#--------------------------------------------
# End-Station Specification
#--------------------------------------------

*.n2.hasOutgoingStreams = false
*.n2.numApps = 7

*.n2.bridging.streamIdentifier.identifier.mapping = []
*.n2.bridging.streamCoder.encoder.mapping = []

*.n3.hasOutgoingStreams = true
*.n3.numApps = 7

*.n3.bridging.streamIdentifier.identifier.mapping = [{stream: "0_0", packetFilter: expr(udp.destPort == 1000)}, {stream: "0_1", packetFilter: expr(udp.destPort == 1001)}, {stream: "1_0", packetFilter: expr(udp.destPort == 1002)}, {stream: "1_1", packetFilter: expr(udp.destPort == 1003)}, {stream: "2_0", packetFilter: expr(udp.destPort == 1004)}, {stream: "3_0", packetFilter: expr(udp.destPort == 1005)}, {stream: "3_1", packetFilter: expr(udp.destPort == 1006)}]
*.n3.bridging.streamCoder.encoder.mapping = [{stream: "0_0", pcp: 1}, {stream: "0_1", pcp: 1}, {stream: "1_0", pcp: 3}, {stream: "1_1", pcp: 3}, {stream: "2_0", pcp: 2}, {stream: "3_0", pcp: 3}, {stream: "3_1", pcp: 3}]


#--------------------------------------------
# Stream Specification
#--------------------------------------------

*.n3.app[0].typename = "UdpSourceApp"
*.n3.app[0].packetName = "0_0"
*.n3.app[0].io.destAddress = "n2"
